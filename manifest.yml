packs:
  core-infrastructure:
    description: Base pack providing shared SMW properties, common templates, and base categories that other packs depend on
    version: 1.0.0
    pages:
      - Template:Infobox
      - Category:Lab Content
      - Property:Last Updated
      - Property:Status
      - Property:Owner
      - Property:Created Date
      - Template:Lab Room
      - Form:Lab Room
      - Category:Lab Room
      - Property:Room Number
      - Property:Building
      - Property:Floor
      - Property:Room Capacity
    depends_on: []
  equipment-management:
    description: Track lab equipment, maintenance schedules, calibration, and usage
    version: 1.0.0
    pages:
      - Template:Equipment
      - Form:Equipment
      - Category:Equipment
      - Category:Equipment by Type
      - Property:Equipment Type
      - Property:Equipment Location
      - Property:Last Maintenance Date
      - Property:Next Calibration Date
      - Property:Equipment Cost
      - Equipment Dashboard
      - Equipment Maintenance Schedule
    depends_on:
      - core-infrastructure
  protocol-management:
    description: Manage standard operating procedures, protocols, and link them to equipment and personnel
    version: 1.0.0
    pages:
      - Template:Protocol
      - Form:Protocol
      - Category:Protocol
      - Category:Protocol by Type
      - Property:Protocol Version
      - Property:Protocol Author
      - Property:Last Review Date
      - Property:Required Equipment
      - Property:Required Certification
      - Protocol Index
      - Protocol by Equipment
    depends_on:
      - core-infrastructure
      - equipment-management
  personnel-management:
    description: Track lab members, roles, training, certifications, and equipment authorizations
    version: 1.0.0
    pages:
      - Template:Personnel
      - Form:Personnel
      - Category:Personnel
      - Category:Personnel by Role
      - Property:Personnel Role
      - Property:Personnel Email
      - Property:Start Date
      - Property:Supervisor
      - Property:Equipment Authorization
      - Property:Certification
      - Personnel Directory
      - Personnel Training Matrix
    depends_on:
      - core-infrastructure
  safety-compliance:
    description: Trackk safety incidents, compliance checks, certifications, and link to equipment, protocols, and personnel
    version: 1.0.0
    pages:
      - Template:Safety Incident
      - Template:Safety Certification
      - Form:Safety Incident
      - Form:Safety Certification
      - Category:Safety Incident
      - Category:Safety Certification
      - Property:Incident Date
      - Property:Incident Severity
      - Property:Incident Equipment
      - Property:Incident Personnel
      - Property:Incident Protocol
      - Property:Certification Type
      - Property:Certification Expiry
      - Property:Required For Equipment
      - Safety Dashboard
      - Compliance Status
    depends_on:
      - core-infrastructure
      - equipment-management
      - protocol-management
      - personnel-management
